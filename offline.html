<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#070A0F" />
  <title>Prisma – Offline</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Inter, system-ui, -apple-system, sans-serif;
      background: #070A0F;
      color: #e5e7eb;
      padding: 24px;
      text-align: center;
    }
    .card {
      max-width: 360px;
      background: rgba(17, 24, 39, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 28px 22px;
    }
    h1 { font-size: 1.25rem; margin-bottom: 8px; color: #fff; }
    p { font-size: 0.95rem; color: #94a3b8; line-height: 1.5; margin-bottom: 20px; }
    button {
      background: #3b82f6;
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 12px 20px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      min-height: 44px;
      min-width: 120px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Você está offline</h1>
    <p>O Prisma não conseguiu conectar. Verifique a internet e tente novamente. O app shell continua disponível quando possível.</p>
    <button type="button" onclick="location.reload()">Tentar novamente</button>
  </div>
</body>
</html>
